[env:radio-s3]
extends = env:esp32s3
platform = platformio/espressif32 @ 6.12.0
board_build.flash_mode = dio
board_build.partitions = components/boards/partitions-radio.csv
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio"
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:radio-s3-v2]
extends = env:radio-s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.radio;config/sdkconfig.defaults.radio-v2"
